apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nextjs-route
  labels:
    app.kubernetes.io/name: nextjs
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: (Host(`foliapicnic.com`) || Host(`family-picnic.dev.qubitquilt.dev`)) && PathPrefix(`/`)
      services:
        - name: nextjs
          port: 80
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: photoprism-route
  labels:
    app.kubernetes.io/name: photoprism
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: (Host(`photos.foliapicnic.com`) || Host(`photos.family-picnic.dev.qubitquilt.dev`)) && PathPrefix(`/`)
      services:
        - name: photoprism
          port: 8080
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: seaweedfs-route
  labels:
    app.kubernetes.io/name: seaweedfs
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`i.foliapicnic.com`) && PathPrefix(`/`)
      services:
        - name: seaweedfs
          port: 8333
  tls: {}
