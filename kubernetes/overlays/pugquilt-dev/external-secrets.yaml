apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: seaweedfs-credentials
  labels:
    app.kubernetes.io/name: seaweedfs
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: seaweedfs-credentials
    deletionPolicy: Retain
  data:
    - secretKey: access-key-id
      remoteRef:
        key: secret/family-picnic-prod/seaweedfs
        property: access-key-id
    - secretKey: secret-access-key
      remoteRef:
        key: secret/family-picnic-prod/seaweedfs
        property: secret-access-key
    # FPP-69: the seaweedfs-credentials Secret is also the chart's
    # `s3.existingConfigSecret`. The chart reads the `seaweedfs_s3_config`
    # key and mounts the inline JSON as the S3 identity file. The JSON
    # itself is rendered in scripts/populate-openbao-secrets.sh so
    # it's a single OpenBao write per change.
    - secretKey: seaweedfs_s3_config
      remoteRef:
        key: secret/family-picnic-prod/seaweedfs
        property: s3-config-json
