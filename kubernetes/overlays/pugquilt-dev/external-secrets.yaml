apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  labels:
    app.kubernetes.io/name: postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: postgres-credentials
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: secret/family-picnic-prod/postgres
        property: password
---
