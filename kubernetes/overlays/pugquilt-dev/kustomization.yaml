apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: family-picnic-dev

commonLabels:
  app.kubernetes.io/part-of: family-picnic
  environment: dev
  cluster: pugquilt

resources:
  - external-secrets.yaml
  - ../../base

patches:
  - path: nextjs-patch.yaml
  - path: postgres-patch.yaml
  - path: photoprism-patch.yaml
  - path: pvc-patch.yaml
  - path: patches/postgres-netpol-patch.yaml
  - path: patches/db-backup-endpoint-patch.yaml
  - patch: |-
      - op: remove
        path: /spec/template/spec/topologySpreadConstraints
    target:
      kind: Deployment
      name: nextjs
  - patch: |-
      - op: replace
        path: /spec/refreshInterval
        value: 1m
    target:
      kind: ExternalSecret
      name: postgres-credentials
  - patch: |-
      - op: replace
        path: /spec/refreshInterval
        value: 1m
    target:
      kind: ExternalSecret
      name: nextjs-secrets
  - patch: |-
      - op: replace
        path: /spec/refreshInterval
        value: 1m
    target:
      kind: ExternalSecret
      name: photoprism-credentials
  - patch: |-
      - op: replace
        path: /spec/refreshInterval
        value: 1m
    target:
      kind: ExternalSecret
      name: seaweedfs-credentials

images:
  - name: ghcr.io/family-picnic/platform
    newName: ghcr.io/michaelruelas/family-picnic-platform
    newTag: main-d8814d7
  - name: photoprism/photoprism
    newName: photoprism/photoprism
    newTag: '260601'

patchesJson6902:
  - path: patches/probes-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: nextjs
