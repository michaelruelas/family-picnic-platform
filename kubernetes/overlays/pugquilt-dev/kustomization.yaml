apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: family-picnic-dev

commonLabels:
  app.kubernetes.io/part-of: family-picnic
  environment: dev
  cluster: pugquilt

resources:
  - ../../base

patches:
  - path: nextjs-patch.yaml
  - path: postgres-patch.yaml
  - path: photoprism-patch.yaml
  - path: pvc-patch.yaml
  - patch: |-
      - op: remove
        path: /spec/template/spec/topologySpreadConstraints
    target:
      kind: Deployment
      name: nextjs
  - patch: |-
      - op: replace
        path: /spec/refreshInterval
        value: 1m
    target:
      kind: ExternalSecret
      name: postgres-credentials
  - patch: |-
      - op: replace
        path: /spec/refreshInterval
        value: 1m
    target:
      kind: ExternalSecret
      name: nextjs-secrets
  - patch: |-
      - op: replace
        path: /spec/refreshInterval
        value: 1m
    target:
      kind: ExternalSecret
      name: photoprism-credentials

images:
  - name: ghcr.io/family-picnic/platform
    newName: ghcr.io/family-picnic/platform
    newTag: v0.1.10
  - name: photoprism/photoprism
    newName: photoprism/photoprism
    newTag: latest
