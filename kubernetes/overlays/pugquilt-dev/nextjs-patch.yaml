apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextjs
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: nextjs
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 2Gi
          env:
            - name: NODE_ENV
              value: development
            - name: LOG_LEVEL
              value: debug
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nextjs
spec:
  minReplicas: 1
  maxReplicas: 3
