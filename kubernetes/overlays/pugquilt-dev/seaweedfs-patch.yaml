apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
spec:
  template:
    spec:
      containers:
        - name: seaweedfs
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: seaweedfs
spec:
  minAvailable: 0
